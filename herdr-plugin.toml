id = "yarrasys.fleet"
name = "Fleet"
version = "0.17.0"
min_herdr_version = "0.9.4"
description = "Start, restart and swap a team of named coding agents from a per-repository fleet file (.herdr/fleet.toml)."
platforms = ["linux", "macos"]

[[actions]]
id = "up"
title = "Fleet: up"
contexts = ["workspace"]
command = ["python3", "bin/herdr-fleet", "up", "--notify"]

[[actions]]
id = "status"
title = "Fleet: status"
contexts = ["workspace"]
command = ["python3", "bin/herdr-fleet", "ui", "status"]

[[actions]]
id = "manage"
title = "Fleet: manage (restart, swap, kickoff, down)"
contexts = ["workspace"]
command = ["python3", "bin/herdr-fleet", "ui", "manage"]

[[actions]]
id = "doctor"
title = "Fleet: doctor"
contexts = ["global"]
command = ["python3", "bin/herdr-fleet", "doctor", "--notify"]

[[actions]]
id = "init"
title = "Fleet: init (write a starter .herdr/fleet.toml here)"
contexts = ["workspace"]
command = ["python3", "bin/herdr-fleet", "init", "--notify"]

[[actions]]
id = "tile"
title = "Fleet: tile (re-tile the seats in place)"
contexts = ["workspace"]
command = ["python3", "bin/herdr-fleet", "tile", "--notify"]

[[actions]]
id = "watch"
title = "Fleet: watch"
contexts = ["workspace"]
command = ["python3", "bin/herdr-fleet", "ui", "watch"]

[[actions]]
id = "go"
title = "Fleet: go to a seat"
contexts = ["workspace"]
command = ["python3", "bin/herdr-fleet", "ui", "go"]

[[panes]]
id = "status"
title = "Fleet status"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/herdr-fleet\" status --hold"]

[[panes]]
id = "manage"
title = "Fleet"
placement = "popup"
width = "70%"
height = "60%"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/herdr-fleet\" menu"]

# Opened by `ui go` (design 22.2): pick a seat or contact, focus it, close.
[[panes]]
id = "go"
title = "Fleet: go"
placement = "popup"
width = "50%"
height = "50%"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/herdr-fleet\" menu --go"]

# Opened by `ui watch` with --placement split (design 18.6); runs until Ctrl-C or the pane closes.
[[panes]]
id = "watch"
title = "Fleet watch"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/herdr-fleet\" watch"]

# Opened by `restart NAME --handover` or `swap NAME --handover` with --placement tab (design 32.5): waits
# for the seat's turn to end, restarts or swaps it, then closes itself.
[[panes]]
id = "handover"
title = "Fleet handover"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/bin/herdr-fleet\" handover"]
